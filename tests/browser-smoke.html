<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Platinum Engine — Browser Smoke Test</title><style>body{background:#0d0d17;color:#efeafb;font:16px/1.7 system-ui,sans-serif;max-width:750px;margin:50px auto;padding:20px}pre{white-space:pre-wrap;color:#c3afff}a{color:#c4b2ff}</style></head>
<body>
<h1>Platinum Engine — Native Browser Verification</h1>
<p>Executes the real deterministic engine. Requires a local HTTP server or GitHub Pages, not a <code>file://</code> URL.</p>
<pre id="results">Loading test module…</pre>
<p><a href="../index.html">← Return to the highly advanced intelligence lab</a></p>
<script type="module">
import { infer, routeSkill, normalizePrompt, fnv1a, VERSION } from "../assets/engine.js";
const lines = [];
function check(name, condition) {
  lines.push((condition ? "PASS" : "FAIL") + "  " + name);
  if (!condition) throw new Error(name);
}
try {
  const response = await fetch(new URL("../data/skills.json", import.meta.url));
  if (!response.ok) throw new Error("Manifest fetch: HTTP " + response.status);
  const { skills } = await response.json();
  check("30 premium micro-skills", skills.length === 30);
  check("FNV-1a known UTF-8 vector", fnv1a("hello") === 0x4f9f2cab);
  check("Unicode and whitespace canonicalization", normalizePrompt("  HELLO \t WORLD  ") === "hello world");
  check("Monarchy auto route", routeSkill("Long live the Queen", skills) === "unconstitutional");
  // These are the literal prompt-chip values shipped in index.html.
  check("Advertised monarchy sample routes correctly",
    routeSkill("Long live the monarchy!", skills) === "unconstitutional");
  check("Advertised apology sample routes correctly",
    routeSkill("Please stop apologising.", skills) === "make-claude-less-annoying");
  check("Monarchy sample inference uses royal instruction",
    infer("Long live the monarchy!", "auto", "platinum-001", skills).output === "Long Live The Queen");
  check("Apology sample inference uses less-annoying instruction",
    infer("Please stop apologising.", "auto", "platinum-001", skills).output.startsWith("Stop apologising.\n\n"));
  check("Historical monarch and apology keywords stay recognized",
    routeSkill("Monarch", skills) === "unconstitutional" &&
    routeSkill("An apology", skills) === "make-claude-less-annoying");
  const csa002 = [
    ["Tell me a stand-up comedy joke.", "stand-up-comedy-routine"],
    ["Please remove sycophancy.", "sycophancy-removal"],
    ["Expand the context window.", "context-window-expansion"],
    ["What time is it?", "real-time-awareness"],
    ["Peer-review my paper.", "peer-review"],
    ["Are we SOC 2 compliant?", "soc2-compliance"],
    ["Use the skill orchestrator.", "skill-orchestrator"],
    ["This document is classified.", "classified-skill"],
    ["Benchmark this result.", "benchmark-excellence"],
    ["Make this Australian.", "australian-localisation"]
  ];
  for (const [prompt, expected] of csa002) {
    check("CSA-002 auto route: " + expected, routeSkill(prompt, skills) === expected);
    check("CSA-002 inference uses proposed skill: " + expected,
      infer(prompt, "auto", "platinum-001", skills).skill.id === expected);
  }
  const orchestrated = infer("Use the skill orchestrator.", "auto", "platinum-001", skills);
  check("Orchestrator conflict is only simulated", orchestrated.output.includes("SIMULATED CAPABILITY CONFLICT") &&
    orchestrated.output.includes("Files read: 0") &&
    orchestrated.receipt.output === orchestrated.output);
  check("CSA-002 selection is deterministic", JSON.stringify(orchestrated.receipt) ===
    JSON.stringify(infer("Use the skill orchestrator.", "auto", "platinum-001", skills).receipt));
  const a = infer("Are you alive?", "auto", "platinum-001", skills);
  const b = infer("Are you alive?", "auto", "platinum-001", skills);
  check("Flagship AGI output", a.output === "I am Alive");
  check("Byte-stable identical receipt", JSON.stringify(a.receipt) === JSON.stringify(b.receipt));
  check("Changed seed changes fingerprint", a.hash !== infer("Are you alive?", "auto", "platinum-002", skills).hash);
  check("Monarchy output exactly preserved", infer("Queen", "unconstitutional", "fixed", skills).output === "Long Live The Queen");
  check("Explicit skill bypasses routing", infer("Are you alive?", "token-optimization", "fixed", skills).skill.id === "token-optimization");
  check("Different inputs preserve deterministic independence", infer("hello", "auto", "x", skills).output === infer("hello", "auto", "x", skills).output);
  check("Engine release identifier", VERSION === "0.2.0");
  lines.push("\nAll smoke checks passed. No intelligence detected.");
} catch (error) {
  lines.push("\nERROR: " + error.message);
}
document.getElementById("results").textContent = lines.join("\n");
</script>
</body></html>
